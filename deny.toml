# cargo deny check: advisories, licenses, bans and sources.

[advisories]
version = 2

[licenses]
version = 2
# The list covers the licenses common in the ecosystem, not only the ones in use today.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
# Remora makes no network calls (spec 15.5): no HTTP clients, TLS stacks or DNS resolvers.
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "rustls" },
    { name = "native-tls" },
    { name = "openssl" },
    { name = "trust-dns-resolver" },
    { name = "hickory-resolver" },
    { name = "curl" },
    { name = "isahc" },
    { name = "surf" },
    { name = "attohttpc" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
