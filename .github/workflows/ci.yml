name: ci

on:
  pull_request:
  push:
    # `plan-*` work branches run the macOS and Windows jobs before a plan is merged.
    branches: [main, 'plan-*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Format
        run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos, windows]
        include:
          # The runners' own temp folders: ext4, APFS, NTFS.
          - os: linux
            runner: ubuntu-latest
            expect_clones: "0"
          - os: macos
            runner: macos-latest
            expect_clones: "0"
          - os: windows
            runner: windows-latest
            expect_clones: "0"
    runs-on: ${{ matrix.runner }}
    # A hung test fails the job instead of holding a runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
        env:
          REMORA_EXPECT_CLONES: ${{ matrix.expect_clones }}
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # The snapshot store on real filesystems, each mounted from an image.
  fs:
    name: fs (${{ matrix.fs }})
    strategy:
      fail-fast: false
      matrix:
        fs: [btrfs, xfs, ext4]
        include:
          - fs: btrfs
            expect_clones: "0"
          - fs: xfs
            expect_clones: "0"
          - fs: ext4
            expect_clones: "0"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Mount a ${{ matrix.fs }} image
        env:
          FS: ${{ matrix.fs }}
        run: |
          sudo apt-get install -y -qq btrfs-progs xfsprogs > /dev/null
          truncate -s 1G "$RUNNER_TEMP/fs.img"
          case "$FS" in
            btrfs) sudo mkfs.btrfs -q "$RUNNER_TEMP/fs.img" ;;
            xfs) sudo mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/fs.img" ;;
            ext4) sudo mkfs.ext4 -q -F "$RUNNER_TEMP/fs.img" ;;
          esac
          sudo mkdir -p /mnt/remora-fs
          sudo mount -o loop "$RUNNER_TEMP/fs.img" /mnt/remora-fs
          sudo chown "$(id -u):$(id -g)" /mnt/remora-fs
          findmnt /mnt/remora-fs
      - name: Snapshot tests on ${{ matrix.fs }}
        # Every suite runs even when one fails, so one failure does not hide another.
        run: cargo test -p remora-snap -p remora-engine --locked --no-fail-fast
        env:
          REMORA_TEST_FS: /mnt/remora-fs
          REMORA_EXPECT_CLONES: ${{ matrix.expect_clones }}

  fs-refs:
    name: fs (refs)
    # Dev Drive needs Windows 11 or Server 2025.
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Make a Dev Drive
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'devdrive.vhdx'
          $script = Join-Path $env:RUNNER_TEMP 'devdrive.txt'
          @(
            "create vdisk file=`"$vhd`" maximum=4096 type=expandable",
            "select vdisk file=`"$vhd`"",
            'attach vdisk',
            'create partition primary',
            'assign letter=R'
          ) | Set-Content -Path $script -Encoding ascii
          diskpart /s $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Format-Volume -DriveLetter R -DevDrive -Confirm:$false -Force | Format-List
          New-Item -ItemType Directory -Path 'R:\remora-fs' | Out-Null
      - name: Snapshot tests on ReFS
        # Every suite runs even when one fails, so one failure does not hide another.
        run: cargo test -p remora-snap -p remora-engine --locked --no-fail-fast
        env:
          REMORA_TEST_FS: 'R:\remora-fs'
          REMORA_EXPECT_CLONES: "0"

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `+1.89` overrides rust-toolchain.toml, which pins `stable`.
      - name: Check
        run: cargo +1.89 check --workspace --all-targets --locked
