name: ci

on:
  pull_request:
  push:
    # `plan-*` work branches run the macOS and Windows jobs before a plan is merged.
    branches: [main, 'plan-*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Few jobs on purpose: every job is billed by the started minute, and macOS and Windows
# minutes cost 10x and 2x Linux ones. Clippy and docs for macOS and Windows run locally
# with cross-target checks before a push; CI runs those platforms' tests.
jobs:
  linux:
    name: linux (fmt, clippy, test, docs, msrv)
    runs-on: ubuntu-latest
    # A hung test fails the job instead of holding a runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 1.89 first: the last toolchain installed is the default (rust-toolchain.toml pins stable anyway).
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.89"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        # The runner's temp folder is ext4: no clones.
        run: cargo test --workspace --locked
        env:
          REMORA_EXPECT_CLONES: "0"
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: MSRV (1.89)
        # `+1.89` overrides rust-toolchain.toml, which pins `stable`.
        run: cargo +1.89 check --workspace --all-targets --locked

  macos:
    name: macos (test on APFS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test
        run: cargo test --workspace --locked
        env:
          REMORA_EXPECT_CLONES: "1"

  windows:
    name: windows (test on NTFS and ReFS)
    # Dev Drive (ReFS) needs Windows 11 or Server 2025.
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Make a Dev Drive
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'devdrive.vhdx'
          $script = Join-Path $env:RUNNER_TEMP 'devdrive.txt'
          @(
            "create vdisk file=`"$vhd`" maximum=4096 type=expandable",
            "select vdisk file=`"$vhd`"",
            'attach vdisk',
            'create partition primary',
            'assign letter=R'
          ) | Set-Content -Path $script -Encoding ascii
          diskpart /s $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Format-Volume -DriveLetter R -DevDrive -Confirm:$false -Force | Format-List
          New-Item -ItemType Directory -Path 'R:\remora-fs' | Out-Null
      - name: Test on NTFS
        # The runner's temp folder is NTFS: no clones.
        run: cargo test --workspace --locked
        env:
          REMORA_EXPECT_CLONES: "0"
      - name: Snapshot tests on ReFS
        # Runs even when the NTFS tests failed, so one failure does not hide another.
        if: success() || failure()
        run: cargo test -p remora-snap -p remora-engine --locked --no-fail-fast
        env:
          REMORA_TEST_FS: 'R:\remora-fs'
          REMORA_EXPECT_CLONES: "1"

  # The snapshot store on real filesystems, each mounted from an image; one build for all three.
  fs:
    name: fs (btrfs, xfs, ext4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Mount btrfs, xfs and ext4 images
        run: |
          sudo apt-get install -y -qq btrfs-progs xfsprogs > /dev/null
          for fs in btrfs xfs ext4; do
            img="$RUNNER_TEMP/$fs.img"
            truncate -s 1G "$img"
            case "$fs" in
              btrfs) sudo mkfs.btrfs -q "$img" ;;
              xfs) sudo mkfs.xfs -q -m reflink=1 "$img" ;;
              ext4) sudo mkfs.ext4 -q -F "$img" ;;
            esac
            sudo mkdir -p "/mnt/remora-$fs"
            sudo mount -o loop "$img" "/mnt/remora-$fs"
            sudo chown "$(id -u):$(id -g)" "/mnt/remora-$fs"
            findmnt "/mnt/remora-$fs"
          done
      - name: Build the tests
        run: cargo test -p remora-snap -p remora-engine --locked --no-run
      # Each filesystem runs even when another failed, and every suite runs in each.
      - name: Snapshot tests on btrfs
        if: success() || failure()
        run: cargo test -p remora-snap -p remora-engine --locked --no-fail-fast
        env:
          REMORA_TEST_FS: /mnt/remora-btrfs
          REMORA_EXPECT_CLONES: "1"
      - name: Snapshot tests on xfs
        if: success() || failure()
        run: cargo test -p remora-snap -p remora-engine --locked --no-fail-fast
        env:
          REMORA_TEST_FS: /mnt/remora-xfs
          REMORA_EXPECT_CLONES: "1"
      - name: Snapshot tests on ext4
        if: success() || failure()
        run: cargo test -p remora-snap -p remora-engine --locked --no-fail-fast
        env:
          REMORA_TEST_FS: /mnt/remora-ext4
          REMORA_EXPECT_CLONES: "0"
