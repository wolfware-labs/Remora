name: drift

# The real Claude Code, latest release, against Remora's hooks: catches changes in hook
# payloads before users do. It calls the model, so it runs weekly and by hand only.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  claude-code:
    name: claude code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "skipped: no ANTHROPIC_API_KEY secret"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        if: steps.key.outputs.present == 'true'
        with:
          toolchain: stable
      - name: Install Claude Code
        if: steps.key.outputs.present == 'true'
        run: |
          npm install --global @anthropic-ai/claude-code
          claude --version
      - name: Real Claude Code session
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REMORA_TEST_CLAUDE: "1"
        run: cargo test -p remora-cli --test claude_code --locked -- --nocapture
