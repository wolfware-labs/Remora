[workspace]
resolver = "3"
members = ["crates/remora-snap", "crates/remora-journal"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/wolfware-labs/remora"
homepage = "https://github.com/wolfware-labs/remora"
authors = ["Mariano Santoro"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
walkdir = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
ed25519-dalek = "3"
getrandom = "0.4"
tempfile = "3"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
